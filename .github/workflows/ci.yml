name: CI

on:
  push:
  pull_request:

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint PHP files
        run: |
          set -eu
          failed=0
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file" || failed=1
          done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No PHP files found"
            exit 1
          fi
          exit "$failed"
