name: CI

on:
  push:
  pull_request:

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint PHP files
        run: |
          set -eu
          failed=0
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file" || failed=1
          done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No PHP files found"
            exit 1
          fi
          exit "$failed"

      - name: Calculator form test
        run: php tests/calculator_form_test.php

      - name: Top coins ranking test
        run: php tests/top_coins_test.php

      - name: Coin link escaping test
        run: php tests/coin_link_test.php

      - name: Affiliate link escaping test
        run: php tests/affiliate_link_test.php

      - name: Coin display test
        run: php tests/coin_display_test.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Coin poll format test
        run: node tests/coin_poll_format_test.js

      - name: Coin cache refresh test
        run: php tests/coin_cache_refresh_test.php
